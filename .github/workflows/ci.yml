name: OBLIVION CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: g++
          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: clang++
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (GCC / Clang)
        if: runner.os == 'Linux'
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  desktop-qt:
    name: Ubuntu Qt 6 Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 Widgets and SerialPort
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-serialport-dev
      - name: Configure native desktop
        run: cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=Release -DOBLIVION_BUILD_DESKTOP=ON -DOBLIVION_BUILD_TESTS=OFF -DOBLIVION_BUILD_EXAMPLES=OFF
      - name: Build native desktop
        run: cmake --build build-desktop --config Release --parallel
      - name: Upload Linux desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: OBLIVION-desktop-linux
          path: build-desktop/oblivion_desktop
          if-no-files-found: error


  simulator-protocol:
    name: Standalone simulator protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile simulator/oblivion_simulator.py simulator/test_protocol.py
      - name: Test protocol and telemetry payload
        working-directory: simulator
        run: python -m unittest -v test_protocol.py
