name: OBLIVION Desktop Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to publish (for manual runs)
        required: false
        default: v0.2.1
        type: string

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: OBLIVION-linux-x64
          - os: windows-2022
            artifact: OBLIVION-windows-x64
          - os: macos-14
            artifact: OBLIVION-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-serialport-dev
      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtserialport
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtserialport
      - name: Configure
        run: cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=Release -DOBLIVION_BUILD_DESKTOP=ON -DOBLIVION_BUILD_TESTS=OFF -DOBLIVION_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build-desktop --config Release --parallel
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/OBLIVION/lib package/OBLIVION/plugins/platforms
          cp build-desktop/oblivion_desktop package/OBLIVION/
          cp desktop/README.md package/OBLIVION/README-DESKTOP.txt
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqxcb.so package/OBLIVION/plugins/platforms/
          for target in package/OBLIVION/oblivion_desktop package/OBLIVION/plugins/platforms/libqxcb.so; do
            ldd "$target" | awk '/=> \/|^[[:space:]]*\// {for(i=1;i<=NF;i++) if($i ~ /^\//) {print $i; break}}' | while read -r lib; do
              [ -f "$lib" ] && cp -L "$lib" package/OBLIVION/lib/
            done
          done
          cat > package/OBLIVION/OBLIVION.sh <<'EOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"
          export QT_PLUGIN_PATH="$HERE/plugins"
          exec "$HERE/oblivion_desktop" "$@"
          EOF
          chmod +x package/OBLIVION/OBLIVION.sh
          tar -C package -czf OBLIVION-linux-x64.tar.gz OBLIVION
      - name: Deploy Qt and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path "build-desktop/Release/oblivion_desktop.exe"
          windeployqt --release --compiler-runtime --dir package $exe
          Copy-Item $exe package/
          Copy-Item desktop/README.md package/README-DESKTOP.txt
          Compress-Archive -Path package/* -DestinationPath OBLIVION-windows-x64.zip
      - name: Deploy Qt and package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          APP="build-desktop/oblivion_desktop.app"
          test -d "$APP"
          macdeployqt "$APP" -always-overwrite
          cp desktop/README.md "$APP/Contents/Resources/README-DESKTOP.txt"
          ditto -c -k --sequesterRsrc --keepParent "$APP" OBLIVION-macos-x64.zip
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            OBLIVION-linux-x64.tar.gz
            OBLIVION-windows-x64.zip
            OBLIVION-macos-x64.zip
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          name: OBLIVION ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/OBLIVION-linux-x64.tar.gz
            release-assets/OBLIVION-windows-x64.zip
            release-assets/OBLIVION-macos-x64.zip
